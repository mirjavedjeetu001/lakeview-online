---
deployment:
  tasks:
    - export DEPLOYPATH=/home/lakeviewcafe/public_html
    - /bin/mkdir -p $DEPLOYPATH/build $DEPLOYPATH/images
    - /usr/bin/rsync -av --delete public/build/ $DEPLOYPATH/build/
    - /usr/bin/rsync -av public/images/ $DEPLOYPATH/images/
    - /bin/cp -f public_html/index.php $DEPLOYPATH/index.php
    - /bin/cp -f public_html/.htaccess $DEPLOYPATH/.htaccess
    - /bin/rm -f $DEPLOYPATH/setup.php
    - cd $DEPLOYPATH && /opt/cpanel/ea-php84/root/usr/bin/php artisan migrate --force
    - cd $DEPLOYPATH && /opt/cpanel/ea-php84/root/usr/bin/php artisan cache:forget branches.active.v4
    - cd $DEPLOYPATH && /opt/cpanel/ea-php84/root/usr/bin/php artisan config:cache
    - cd $DEPLOYPATH && /opt/cpanel/ea-php84/root/usr/bin/php artisan route:cache
    - cd $DEPLOYPATH && /opt/cpanel/ea-php84/root/usr/bin/php artisan view:cache
    - /bin/chmod -R 755 $DEPLOYPATH
    - /bin/chmod -R 775 $DEPLOYPATH/storage
    - /bin/chmod -R 775 $DEPLOYPATH/bootstrap/cache
